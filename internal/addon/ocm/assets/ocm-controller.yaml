apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ocm-controller
  name: ocm-controller
  namespace: open-cluster-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocm-controller
  template:
    metadata:
      labels:
        app: ocm-controller
    spec:
      containers:
      - args:
        - /controller
        - --enable-agent-deploy=true
        - --agent-addon-image=quay.io/stolostron/multicloud-manager:latest
        image: quay.io/stolostron/multicloud-manager:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8000
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: ocm-controller
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: 8000
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            memory: 4Gi
          requests:
            cpu: 50m
            memory: 128Mi
      serviceAccountName: ocm-foundation-sa
---
apiVersion: addon.open-cluster-management.io/v1alpha1
kind: ClusterManagementAddOn
metadata:
  annotations:
    addon.open-cluster-management.io/lifecycle: addon-manager
  name: work-manager
spec:
  addOnMeta:
    description: work-manager provides action, view and rbac settings
    displayName: work-manager
  installStrategy:
    placements:
    - name: global
      namespace: open-cluster-management-global-set
    type: Placements
  supportedConfigs:
  - group: addon.open-cluster-management.io
    resource: addondeploymentconfigs
