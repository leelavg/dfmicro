apiVersion: config.openshift.io/v1
kind: ClusterVersion
metadata:
  name: version
  labels:
    app.kubernetes.io/created-by: dfmicro
spec:
  channel: {{.Channel}}
  clusterID: {{.ClusterID}}
status:
