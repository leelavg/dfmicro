apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: odr-consoleplugin-manager
  labels:
    app.kubernetes.io/created-by: dfmicro
rules:
- apiGroups:
  - console.openshift.io
  resources:
  - consoleplugins
  - consoleclidownloads
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: odr-consoleplugin-manager
  labels:
    app.kubernetes.io/created-by: dfmicro
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: odr-consoleplugin-manager
subjects:
- kind: ServiceAccount
  name: odfmo-controller-manager
  namespace: openshift-operators

